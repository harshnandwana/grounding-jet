[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-jev"
version = "0.1.0"
description = "Tools for a photo-free visual grounding annotation dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["huggingface_hub>=0.35,<2"]

[project.scripts]
visual-jev-data = "visual_jev.dataset:main"
visual-jev-fetch = "visual_jev.hf:main"

[tool.setuptools.packages.find]
where = ["src"]
